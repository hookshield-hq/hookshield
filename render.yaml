# Render Blueprint — "Deploy to Render" button (docs/SELF_HOSTING.md).
# One web service (the all-in-one image: dashboard, API, ingest and worker),
# Render Postgres and Render Key Value. The encryption key is generated by
# Render. After the deploy, open the service URL and create your account.
#
# Custom domain: add it in Render, then set HS_PUBLIC_URL=https://your.domain
# on the service. Updates: "Manual Deploy → Deploy latest reference".
services:
  - type: web
    name: hookshield
    runtime: image
    image:
      url: ghcr.io/hookshield-hq/hookshield:latest
    healthCheckPath: /readyz
    envVars:
      - key: HS_DATABASE_URL
        fromDatabase:
          name: hookshield-db
          property: connectionString
      - key: HS_REDIS_URL
        fromService:
          type: keyvalue
          name: hookshield-redis
          property: connectionString
      - key: HS_ENCRYPTION_KEY
        generateValue: true # base64 of 256 random bits — copy it to your password manager
      - key: HS_EMAIL_FROM
        sync: false # e.g. HookShield <no-reply@your.domain>
      - key: HS_RESEND_API_KEY
        sync: false # re_… (https://resend.com); empty = emails are only logged
      - key: HS_RETENTION
        value: 720h

  - type: keyvalue
    name: hookshield-redis
    ipAllowList: [] # private network only
    maxmemoryPolicy: noeviction # queues must never be evicted

databases:
  - name: hookshield-db
    databaseName: hookshield
    user: hookshield
