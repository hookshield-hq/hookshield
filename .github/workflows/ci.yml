name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Also run by release.yml before anything is published (a red CI blocks the release).
  workflow_call:

permissions:
  contents: read

concurrency:
  # github.workflow is the caller's name when called from release.yml, so a release
  # run never cancels (or is cancelled by) the CI run of the same ref.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: go vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: Build
        run: go build -trimpath ./cmd/...

  backend-integration:
    name: Backend integration (PostgreSQL + Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hookshield
          POSTGRES_PASSWORD: hookshield
          POSTGRES_DB: hookshield
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hookshield"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.21
        ports:
          - 1025:1025
          - 8025:8025
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      HS_TEST_DATABASE_URL: postgres://hookshield:hookshield@localhost:5432/hookshield?sslmode=disable
      HS_DATABASE_URL: postgres://hookshield:hookshield@localhost:5432/hookshield?sslmode=disable
      HS_TEST_REDIS_URL: redis://localhost:6379/15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Integration tests (migrations, schema, store, cache, limits, ingest end-to-end)
        run: go test -race -count=1 -tags integration ./...

      - name: Boot migration via the api binary
        run: go run ./cmd/api migrate up && go run ./cmd/api migrate status

      - name: Ingest latency budget (p99 < 20 ms, no -race)
        run: HS_PERF_TEST=1 go test -count=1 -tags integration -run TestLatencyBudget -v ./internal/ingest

      - name: Native dev mode end-to-end (make dev + make smoke)
        working-directory: .
        run: |
          ./scripts/dev.sh > dev.log 2>&1 &
          for i in $(seq 1 120); do grep -q "HookShield is running" dev.log && break; sleep 1; done
          ./scripts/smoke.sh
          ./scripts/alert-demo.sh

      - name: Native dev logs on failure
        if: failure()
        working-directory: .
        run: cat dev.log || true

  e2e-docker:
    name: End-to-end (Docker Compose stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Start the full stack (make up)
        run: make up

      - name: Dashboard is served and points at the API
        run: curl -fsS http://localhost:3000/api/config | grep -q '"apiUrl":"http://localhost:8081"'

      - name: Smoke test (seed → ingest → worker → sink)
        run: make demo

      - name: Alert test (failing endpoint → alert email in Mailpit)
        run: make demo-alert

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Tear down
        if: always()
        run: docker compose down -v

  web:
    name: Dashboard (Next.js)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hookshield
          POSTGRES_PASSWORD: hookshield
          POSTGRES_DB: hookshield
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hookshield"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      mailpit:
        image: axllent/mailpit:v1.21
        ports:
          - 1025:1025
          - 8025:8025 # e2e tests read the verification email (Phase 12)
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Install
        run: npm ci

      - name: API types match the OpenAPI document
        run: npm run gen:api && git diff --exit-code src/lib/api/schema.d.ts

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: i18n (key parity, placeholders, backend error codes, hard-coded text)
        run: npm run check:i18n

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Start the Go services (make dev)
        working-directory: .
        run: |
          ./scripts/dev.sh > dev.log 2>&1 &
          for i in $(seq 1 120); do grep -q "HookShield is running" dev.log && break; sleep 1; done
          grep -q "HookShield is running" dev.log

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (Playwright)
        run: npx playwright test

      - name: Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

      - name: Logs on failure
        if: failure()
        working-directory: .
        run: cat dev.log || true

  website:
    name: Website (landing page + docs)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: i18n (key parity, placeholders, hard-coded text)
        run: npm run check:i18n

      - name: Unit tests (every docs link and anchor resolves)
        run: npm test

      - name: Build (static export)
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (languages, links, accessibility)
        run: npx playwright test

      - name: Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: website-playwright-report
          path: |
            website/playwright-report
            website/test-results
          retention-days: 7
